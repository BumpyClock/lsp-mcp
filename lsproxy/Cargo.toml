[package]
name = "lsproxy"
version = "0.4.4"
edition = "2021"

[lib]
name = "lsproxy"
path = "src/lib.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.3"
regex = { version = "1.8", features = ["std"] }
serde_json = "1.0"
strum = "0.25"
strum_macros = "0.25"
tokio = { version = "1.0", features = ["full", "process"] }
utoipa = "5.4"
rand = "0.8"
async-trait = "0.1"
futures = "0.3"
lsp-types = "0.94"
glob = "0.3.1"
uuid = { version = "1.10.0", features = ["v4"] }
ignore = "0.4.23"
clap = { version = "4.3", features = ["derive"] }
notify = "6.1.1"
notify-debouncer-mini = "0.4.1"
fs_extra = "1.3.0"
json5 = "0.4.1"
mcpkit = { version = "0.5", default-features = false, features = ["server", "tokio-runtime"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8.1"

[profile.release]
incremental = true

[profile.dev]
incremental = true

[[bin]]
name = "lsp-mcp"
path = "src/bin/lsp-mcp.rs"
