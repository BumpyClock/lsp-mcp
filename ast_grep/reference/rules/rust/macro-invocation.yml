# ABOUTME: Rust reference rule for macro invocations.
# ABOUTME: Matches macro identifiers used in macro invocations.
id: macro-invocation
language: rust
rule:
  any:
    - kind: identifier
      pattern: $NAME
      inside:
        kind: macro_invocation
        field: macro
    - kind: identifier
      pattern: $NAME
      inside:
        kind: scoped_identifier
        field: name
        inside:
          kind: macro_invocation
          field: macro
