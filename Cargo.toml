[package]
name = "lsp-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "lsproxy"
path = "src/lib.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.3"
regex = { version = "1.8", features = ["std"] }
serde_json = "1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = { version = "1.0", features = ["full", "process"] }
rand = "0.9.2"
async-trait = "0.1"
futures = "0.3"
lsp-types = "0.94.0"
glob = "0.3.1"
uuid = { version = "1.10.0", features = ["v4"] }
ignore = "0.4.23"
clap = { version = "4.3", features = ["derive"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
fs_extra = "1.3.0"
json5 = "1.3.0"
rmcp = { version = "0.12", features = ["server", "transport-io", "schemars"] }
schemars = "1"
dirs = "6.0.0"
chrono = "0.4"
pulldown-cmark = "0.13.0"

# Semantic search - tree-sitter for chunking
tree-sitter = "0.26.3"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23"
tree-sitter-md = "0.5.1"

# Semantic search - embeddings
fastembed = "5.6.0"
ort = { version = "=2.0.0-rc.10", default-features = false }
reqwest = { version = "0.12", features = ["json"] }

# Semantic search - vector store
hnsw_rs = "0.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }

# Semantic search - utilities
blake3 = "1.5"
parking_lot = "0.12"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8.1"

[features]
default = []
ort-coreml = ["ort/coreml"]
ort-cuda = ["ort/cuda"]
ort-directml = ["ort/directml"]
ort-rocm = ["ort/rocm"]

[profile.release]
incremental = true

[profile.dev]
incremental = true

[[bin]]
name = "lsp-mcp"
path = "src/bin/lsp-mcp.rs"
